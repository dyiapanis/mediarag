name: tests
# MediaRAG check scripts are direct-run (main() + check() counters), NOT
# pytest-collectable despite the test_*.py names — CI runs them as scripts.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (ffmpeg audio decode, pandoc doc lane)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg pandoc
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eg2-onnx-q4-v2
      - name: Model bootstrap (engine globs the HF cache; ~480MB)
        run: timeout 900 python scripts/fetch_model.py
      - name: Model verify (loads the sessions exactly as the engine does)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from core import engine
          print("snap:", engine.snap_dir())
          engine._trunk(); print("trunk OK")
          engine._vis(); print("vision OK")
          engine._aud(); print("audio OK")
          engine._processor(); print("processor OK")
          PY
      - name: Deref units (no model)
        run: python tests/test_engine_deref.py
      - name: Ingest units (incl. OOM-regression caps)
        run: python tests/test_ingest_units.py
      - name: Parity slices
        run: python tests/test_parity_slices.py
      - name: Snapshot pin units (offline)
        run: python tests/test_snapshot_pin.py
      - name: Materialize race (two processes)
        run: python tests/test_materialize_race.py
      - name: Golden parity (engine vs pinned goldens)
        run: python tests/bench_engine.py
      - name: Notion adapter units (offline, no token)
        run: python tests/test_notion_adapter.py
      - name: Adapter text sink units (offline)
        run: python tests/test_adapter_sink_text.py
      - name: URL fetch pinning (offline)
        run: python tests/test_url_pinning.py
      - name: End-to-end smoke (ingest → embed → search → thumbnail)
        run: python tests/test_smoke_e2e.py
      - name: Config root resolution
        run: python tests/test_config_root.py
      - name: Config root paths (offline)
        run: python tests/test_config_root_paths.py
      - name: Contract suite (tool/store/adapter contracts, no model)
        run: python tests/test_contract.py
      - name: Dependency pin and version surfaces in sync
        run: python tests/test_dependency_sync.py

  windows:
    # Portability lane: the model-free suites plus the real engine — the q4
    # towers are cached and the e2e smoke runs. No ffmpeg/pandoc, so the audio
    # and document lanes stay on Linux where those are installed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (does the declared set resolve on Windows?)
        run: pip install -r requirements.txt
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eg2-onnx-q4-v2-win
      - name: Model bootstrap (engine globs the HF cache; ~480MB q4 towers)
        run: python scripts/fetch_model.py
      - name: Model verify (loads the sessions exactly as the engine does)
        run: python -c "import sys; sys.path.insert(0, '.'); from core import engine; [f() for f in (engine._trunk, engine._vis, engine._aud, engine._processor)]; print('sessions OK')"
      - name: Engine import smoke
        run: python -c "import sys; sys.path.insert(0, '.'); from core import engine; print('engine imports OK')"
      - name: Deref units
        run: python tests/test_engine_deref.py
      - name: Snapshot pin units (offline)
        run: python tests/test_snapshot_pin.py
      - name: Materialize race (two processes)
        run: python tests/test_materialize_race.py
      - name: Contract suite (paths, adapters, store, tool contract)
        run: python tests/test_contract.py
      - name: Config root resolution
        run: python tests/test_config_root.py
      - name: Config root paths (offline)
        run: python tests/test_config_root_paths.py
      - name: Dependency pin and version surfaces in sync
        run: python tests/test_dependency_sync.py
      - name: Notion adapter units (offline, no token)
        run: python tests/test_notion_adapter.py
      - name: Adapter text sink units (offline)
        run: python tests/test_adapter_sink_text.py
      - name: URL fetch pinning (offline)
        run: python tests/test_url_pinning.py
      - name: End-to-end smoke (ingest → embed → search → thumbnail)
        run: python tests/test_smoke_e2e.py

  macos:
    # Apple Silicon only: onnxruntime 1.29 and torch 2.15 publish no x86_64
    # macOS wheels, and the arm64 ones declare macosx_14_0. No brew installs —
    # the smoke is md+png, so ffmpeg/pandoc/poppler are not needed to prove the
    # engine runs here. Doc/audio lanes stay Linux-parity.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (does the declared set resolve on Apple Silicon?)
        run: pip install -r requirements.txt
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eg2-onnx-q4-v2-macos
      - name: Model bootstrap (engine globs the HF cache; ~480MB q4 towers)
        run: python scripts/fetch_model.py
      - name: Model verify (loads the sessions exactly as the engine does)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from core import engine
          engine._trunk(); print("trunk OK")
          engine._vis(); print("vision OK")
          engine._aud(); print("audio OK")
          engine._processor(); print("processor OK")
          PY
      - name: Deref units
        run: python tests/test_engine_deref.py
      - name: Snapshot pin units (offline)
        run: python tests/test_snapshot_pin.py
      - name: Materialize race (two processes)
        run: python tests/test_materialize_race.py
      - name: Contract suite (paths, adapters, store, tool contract)
        run: python tests/test_contract.py
      - name: Config root resolution
        run: python tests/test_config_root.py
      - name: Config root paths (offline)
        run: python tests/test_config_root_paths.py
      - name: Dependency pin and version surfaces in sync
        run: python tests/test_dependency_sync.py
      - name: Notion adapter units (offline, no token)
        run: python tests/test_notion_adapter.py
      - name: Adapter text sink units (offline)
        run: python tests/test_adapter_sink_text.py
      - name: URL fetch pinning (offline)
        run: python tests/test_url_pinning.py
      - name: End-to-end smoke (ingest → embed → search → thumbnail)
        run: python tests/test_smoke_e2e.py
