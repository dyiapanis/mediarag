name: tests
# MediaRAG check scripts are direct-run (main() + check() counters), NOT
# pytest-collectable despite the test_*.py names — CI runs them as scripts.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (ffmpeg audio decode, pandoc doc lane)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg pandoc
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eg2-onnx-q4
      - name: Model bootstrap (engine globs the HF cache; ~480MB + dereference)
        # ORT's external-data containment check follows the HF cache symlinks
        # to the sharded blobs dirs and refuses (graph in blobs/d7/, data in
        # blobs/23/). Copy the q4 files as REAL files into a snapshot dir that
        # sorts last under the engine's snapshots/*/onnx glob.
        run: |
          HUB=~/.cache/huggingface/hub/models--onnx-community--embeddinggemma-2-ONNX
          if [ ! -f "$HUB/snapshots/zz-real/onnx/model_q4.onnx_data" ]; then
            timeout 900 python -c "from huggingface_hub import snapshot_download; snapshot_download('onnx-community/embeddinggemma-2-ONNX', allow_patterns=['*.json', 'chat_template.jinja', '*.md', 'onnx/*_q4.onnx', 'onnx/*_q4.onnx_data'])"
            SNAP=$(ls -d "$HUB"/snapshots/*/ | grep -v zz-real | head -1)
            mkdir -p "$HUB/snapshots/zz-real/onnx"
            cp -L "$SNAP"onnx/*_q4.onnx "$SNAP"onnx/*_q4.onnx_data "$HUB/snapshots/zz-real/onnx/"
          fi
          ls -l "$HUB/snapshots/zz-real/onnx/"
      - name: Model verify (loads the sessions exactly as the engine does)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from core import engine
          engine._trunk(); print("trunk OK")
          engine._vis(); print("vision OK")
          engine._aud(); print("audio OK")
          engine._processor(); print("processor OK")
          PY
      - name: Ingest units (incl. OOM-regression caps)
        run: python tests/test_ingest_units.py
      - name: Parity slices
        run: python tests/test_parity_slices.py
      - name: Config root resolution
        run: python tests/test_config_root.py