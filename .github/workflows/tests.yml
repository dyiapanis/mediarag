name: tests
# MediaRAG check scripts are direct-run (main() + check() counters), NOT
# pytest-collectable despite the test_*.py names — CI runs them as scripts.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (ffmpeg audio decode, pandoc doc lane)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg pandoc
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: eg2-onnx-q4-v2
      - name: Model bootstrap (engine globs the HF cache; ~480MB)
        run: timeout 900 python scripts/fetch_model.py
      - name: Model verify (loads the sessions exactly as the engine does)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from core import engine
          print("snap:", engine.snap_dir())
          engine._trunk(); print("trunk OK")
          engine._vis(); print("vision OK")
          engine._aud(); print("audio OK")
          engine._processor(); print("processor OK")
          PY
      - name: Deref units (no model)
        run: python tests/test_engine_deref.py
      - name: Ingest units (incl. OOM-regression caps)
        run: python tests/test_ingest_units.py
      - name: Parity slices
        run: python tests/test_parity_slices.py
      - name: Config root resolution
        run: python tests/test_config_root.py
      - name: Contract suite (tool/store/adapter contracts, no model)
        run: python tests/test_contract.py

  windows:
    # Portability lane: the model-free suites plus an import smoke. No model
    # download and no ffmpeg/pandoc — parity and the ingest units stay on Linux
    # where those are installed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (does the declared set resolve on Windows?)
        run: pip install -r requirements.txt
      - name: Engine import smoke
        run: python -c "import sys; sys.path.insert(0, '.'); from core import engine; print('engine imports OK')"
      - name: Deref units
        run: python tests/test_engine_deref.py
      - name: Contract suite (paths, adapters, store, tool contract)
        run: python tests/test_contract.py
      - name: Config root resolution
        run: python tests/test_config_root.py
