name: mediarag
version: 0.1.15
description: "Multimodal local search over documents and media — pdf, office files, notes, images, audio and subtitles — from any MCP-capable agent."
author: D Yiapanis
license: MIT
kind: standalone
platforms:
  - linux
  - windows
provides_tools:
  - mediarag_search
  - mediarag_add_note
  - mediarag_ingest_dir
  - mediarag_add_source
  - mediarag_status
provides_hooks: []
provides_middleware: []
requires_env: []
optional_env:
  - RAINDROP_API_TOKEN
python_dependencies:
  - "onnxruntime==1.29.0"
  - "numpy>=2.0,<3"
  - "pillow>=11.0,<13"
  - "tokenizers>=0.20,<1"
  - "transformers==5.19.0"
  - "torch>=2.2,<3"
  - "torchvision>=0.17,<1"
  - "huggingface_hub>=0.26,<3"
